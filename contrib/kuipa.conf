# httpd: /etc/httpd/conf.d/kuipa.conf
# Forward the post-quantum enrollment endpoints to kuipad.
# mod_proxy adds X-Forwarded-For (ProxyAddHeaders, on by default): the
# daemon's per-address rate limit uses its last entry.
ProxyPass "/ipa/ku/" "unix:/run/ipa/kuipad.sock|http://localhost/ipa/ku/"
<Location "/ipa/ku/">
    Require all granted
    # Largest request body kuipad accepts (its BODY_LIMIT); refuse more
    # before it is proxied.
    LimitRequestBody 1048576
    # Advertisements are mostly random bytes, but the base64 compresses.
    SetOutputFilter DEFLATE
</Location>
