[package]
name = "kuipa-ldap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synchronous LDAP client (from ahdapa-ldap): simple, GSSAPI and S4U binds, search, modify, extended operations"

[dependencies]
kuipa-gssapi = { path = "../kuipa-gssapi" }
libc = "0.2"
native-ossl.workspace = true
thiserror = "2"
tracing = "0.1"

[build-dependencies]
pkg-config = "0.3"

# Same as the workspace lints minus `unsafe_code = "forbid"`: Cargo cannot
# override a single inherited lint, and these crates are raw FFI bindings.
[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
incompatible_msrv = "deny"
