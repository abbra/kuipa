[package]
name = "kuipa-fido2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "libfido2 bindings for kuipa: CTAP assertions with hmac-secret and credentials, classical and ML-DSA"

[dependencies]
libc = "0.2"
native-ossl.workspace = true
thiserror = "2"

[build-dependencies]
pkg-config = "0.3"

# Same as the workspace lints minus `unsafe_code = "forbid"`: Cargo cannot
# override a single inherited lint, and these crates are raw FFI bindings.
[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
incompatible_msrv = "deny"
