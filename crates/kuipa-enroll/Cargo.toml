[package]
name = "kuipa-enroll"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "kuipa protocol and key schedule: post-quantum enrollment and keytab protection for FreeIPA"
keywords = ["freeipa", "kerberos", "ml-kem", "ml-dsa", "post-quantum"]
categories = ["cryptography"]

[dependencies]
agirru-crdt.workspace = true
# MTC trees; its OpenSSL backend is native-ossl (and brings PKCS#11 support).
synta-mtc = { version = "0.5.1", default-features = false, features = ["std", "derive", "openssl"] }
# Parsing the CA certificates an advertisement carries.
synta = { version = "0.5.1", default-features = false, features = ["std"] }
synta-certificate = { version = "0.5.1", default-features = false, features = ["std", "derive"] }
# TLS server verification (the `tls` feature), Merkle Tree CAs included.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
rustls-native-ossl = { version = "0.3.3", optional = true }
synta-x509-verification = { version = "0.5.1", default-features = false, features = ["openssl"], optional = true }
native-ossl.workspace = true
serde.workspace = true
serde_json.workspace = true
tang-pqc.workspace = true
# NFKC for recovery-shard passphrases.
unicode-normalization = "0.1"

[features]
# A rustls verifier for kuipad's TLS endpoints: ordinary CAs through
# OpenSSL, Merkle Tree CAs through their proofs.
tls = ["dep:rustls", "dep:rustls-native-ossl", "dep:synta-x509-verification", "synta-certificate/openssl"]
# A software passkey authenticator (`passkey::soft`), for tests.
testing = []

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8"
# The integration tests use the software passkey authenticator.
kuipa-enroll = { path = ".", features = ["testing"] }
kuipa-perf.workspace = true

[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "anchors"
harness = false

[[bench]]
name = "escrow"
harness = false
