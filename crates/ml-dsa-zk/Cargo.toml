[package]
name = "ml-dsa-zk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VOLE-in-the-head zero-knowledge proofs over boolean circuits at λ = 128 or 256, on AES-256 and SHA-512, toward unlinkable ML-DSA blind signatures (research prototype)"
keywords = ["zero-knowledge", "vole", "faest", "post-quantum"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
native-ossl.workspace = true

[lints.rust]
# One documented exception: calling the CPU's carry-less multiply once it
# has been detected (src/clmul.rs).
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
incompatible_msrv = "deny"
