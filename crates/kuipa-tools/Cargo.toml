[package]
name = "kuipa-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "kuipa client tools for FreeIPA hosts: kuipa, kuipa-unseal and kuipa-voucher"

[dependencies]
kuipa-enroll = { workspace = true, features = ["tls"] }
kuipa-gssapi = { path = "../kuipa-gssapi" }
# Passkeys: the passkey factor and passkey-wrapped device keys (§7.6.5).
kuipa-fido2 = { path = "../kuipa-fido2" }
native-ossl.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "blocking"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-native-ossl = "0.3.3"
serde.workspace = true
serde_json.workspace = true
synta = { version = "0.5.1", default-features = false, features = ["std"] }
synta-certificate = { version = "0.5.1", default-features = false, features = ["std", "derive"] }
tang-pqc.workspace = true
# Voucher issuing and blinding (§9).
ml-dsa-blind.workspace = true
# DNS SRV discovery over plain UDP/TCP, DoT and DoH (§4.6), as in akamu;
# no DNSSEC.  The TLS provider is OpenSSL through the ring shim, not
# ring's BoringSSL; server certificates are verified against the system
# roots or `KUIPA_DNS_CA` (dns.rs).
hickory-resolver = { version = "0.26", features = ["tls-ring", "https-ring", "rustls-platform-verifier"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
# The colour decision `clap` itself makes for its help output.
anstream = "1.0"

[features]
# A software security key for `kuipa` (`$KUIPA_SOFT_FIDO2`): the
# playground's, and the tests'.  Never in a build for real hosts.
soft-fido2 = ["kuipa-enroll/testing"]

[dev-dependencies]
# The tests and the playground use the software security key.
kuipa-tools = { path = ".", features = ["soft-fido2"] }
# Test certificates (CA + PKINIT KDC chain), as in kurbu5-pkinit.
synta = { version = "0.5.1", default-features = false, features = ["std"] }
synta-certificate = "0.5.1"
synta-krb5 = "0.5.1"
kuipad = { path = "../kuipad" }
tang-pqc-clevis.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }

[lints.rust]
# One documented exception: setting KRB5_CONFIG before any thread starts.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
incompatible_msrv = "deny"

[[example]]
name = "kuipa-playground"
