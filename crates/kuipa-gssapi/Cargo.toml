[package]
name = "kuipa-gssapi"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "GSSAPI bindings (from ahdapa-gssapi): accept/init contexts with channel bindings, keytab and S4U2Proxy credentials"
license.workspace = true
# Registered so dependents read the detected Kerberos vendor from
# `DEP_KRB5_VENDOR` instead of re-running detection: kuipa-ldap must link the
# same Kerberos implementation this crate was compiled against.
links = "krb5"

[dependencies]
native-ossl.workspace = true
thiserror = "2"
tracing = "0.1"

[build-dependencies]
pkg-config = "0.3"

# Same as the workspace lints minus `unsafe_code = "forbid"`: Cargo cannot
# override a single inherited lint, and these crates are raw FFI bindings.
[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
incompatible_msrv = "deny"
